name: CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

jobs:
  validate:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Setup Bun
        uses: oven-sh/setup-bun@v2
        with:
          bun-version: "1.4.0"

      - name: Install dependencies
        run: bun install

      - name: Typecheck (main process)
        run: bunx tsc -p tsconfig.main.json --noEmit

      - name: Typecheck (renderer process)
        run: bunx tsc -p tsconfig.json --noEmit

      - name: Typecheck (preload script)
        run: bunx tsc -p tsconfig.preload.json --noEmit

      - name: Build
        run: bun run build
